services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    volumes: [mongo_data:/data/db]
  mongo-init:
    image: mongo:7
    depends_on: [mongo]
    restart: "no"
    command: >-
      bash -c 'until mongosh --host mongo --quiet --eval "db.adminCommand({ ping: 1 })"; do sleep 2; done;
      mongosh --host mongo --quiet --eval "try { rs.status() } catch (e) { rs.initiate({_id: \"rs0\", members: [{_id: 0, host: \"mongo:27017\"}]}) }"'
  api:
    build: ./server
    env_file: .env
    environment:
      MONGODB_URI: mongodb://mongo:27017/mittho_ops?replicaSet=rs0
      CLIENT_URL: http://localhost:5173,http://localhost:8080
    depends_on: [mongo-init]
    ports: ["4000:4000"]
  web:
    build: ./client
    ports: ["8080:80"]
    depends_on: [api]
volumes: {mongo_data: {}}
