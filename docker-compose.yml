services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--host", "localhost", "--quiet", "--eval", "quit(db.adminCommand({ping:1}).ok ? 0 : 2)"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  mongo-init:
    image: mongo:7
    restart: "no"
    depends_on:
      mongo:
        condition: service_healthy
    command:
      - bash
      - -ec
      - |
        mongosh --host mongo --quiet --eval 'try { rs.status() } catch (error) { rs.initiate({_id: "rs0", members: [{_id: 0, host: "mongo:27017"}]}) }'
        until mongosh --host mongo --quiet --eval 'quit(db.hello().isWritablePrimary ? 0 : 2)'; do sleep 2; done

  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    init: true
    env_file: .env
    environment:
      PORT: 4000
      MONGODB_URI: ${COMPOSE_MONGODB_URI:-mongodb://mongo:27017/mittho_ops?replicaSet=rs0}
      CLIENT_URL: ${CLIENT_URL:-http://localhost:5173,http://localhost:8080}
    depends_on:
      mongo-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:4000:4000"
    stop_grace_period: 15s
    security_opt:
      - no-new-privileges:true

  web:
    build:
      context: .
      dockerfile: client/Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8080:80"
    security_opt:
      - no-new-privileges:true

volumes:
  mongo_data:
