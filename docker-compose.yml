services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    # P2H.4 — AUTHENTICATION ENABLED.
    #
    # `--auth` alone is not enough for a replica set: members must also
    # authenticate to EACH OTHER, which needs a shared keyfile. Supplying
    # `--keyFile` implies `--auth`, and MongoDB refuses to start if the file is
    # group- or world-readable, which is why the bootstrap script chmods it 400
    # and chowns it to uid 999.
    command:
      - mongod
      - --replSet
      - rs0
      - --bind_ip_all
      - --keyFile
      - /run/secrets/mongo_keyfile
    secrets:
      - mongo_keyfile
      - mongo_root_password
      - mongo_app_password
    volumes:
      - mongo_data:/data/db
    # Phase 28 — network isolation. Mongo sits on the BACKEND network only, so
    # the public-facing `web` container has no route to it at all: an nginx
    # compromise cannot reach the database directly. It is also never published
    # to the host. Verified by asserting `web` cannot resolve/connect to mongo.
    networks:
      - backend
    # Without a cap a single container can fill the host disk with logs and
    # take the whole stack down. Applied to every long-running service.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      # `ping` is one of the few commands allowed WITHOUT authentication, so
      # this still reports liveness once auth is on — and deliberately does not
      # embed a credential in the healthcheck.
      test: ["CMD", "mongosh", "--host", "localhost", "--quiet", "--eval", "quit(db.adminCommand({ping:1}).ok ? 0 : 2)"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  mongo-init:
    image: mongo:7
    restart: "no"
    networks:
      - backend
    depends_on:
      mongo:
        condition: service_healthy
    # P2H.4 — the localhost exception only works from INSIDE the mongo
    # container, so the bootstrap is executed there rather than from here.
    # This service now just waits for that to have happened.
    secrets:
      - mongo_root_password
    command:
      - bash
      - -ec
      - |
        until mongosh --host mongo --quiet \
          -u "${MONGO_ROOT_USERNAME:-mittho_root}" \
          -p "$$(cat /run/secrets/mongo_root_password)" \
          --authenticationDatabase admin \
          --eval 'quit(db.hello().isWritablePrimary ? 0 : 2)'; do
          echo "waiting for an authenticated writable primary..."
          sleep 2
        done

  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    init: true
    env_file: .env
    environment:
      PORT: 4000
      # P2H.4 — the connection string now contains a PASSWORD, so it is read
      # from a mounted file rather than an environment variable. An env var is
      # printed in full by `docker inspect` to anyone with socket access on the
      # host; `services/secrets.js` already supports the `*_FILE` convention.
      MONGODB_URI_FILE: ${MONGODB_URI_FILE:-/run/secrets/mongodb_uri}
      CLIENT_URL: ${CLIENT_URL:-http://localhost:5173,http://localhost:8080}
      # Deployment class. Compose defaults to development; set APP_ENV=staging
      # or production on the real host so CORS refuses to fall back to
      # reflect-any-origin.
      APP_ENV: ${APP_ENV:-development}
      # Exactly one reverse proxy (the `web` nginx) sits in front of this API,
      # and the port is published on 127.0.0.1 only, so Express trusts one hop
      # and reads the client address nginx appended to X-Forwarded-For.
      # Add a hop only if you actually add a proxy in front of nginx.
      TRUST_PROXY: ${TRUST_PROXY:-1}
      # Payment gateways. Secrets come from .env (git-ignored) and are never
      # baked into an image. PAYMENT_MODE guards against taking real money
      # with sandbox credentials, or vice versa.
      PAYMENT_MODE: ${PAYMENT_MODE:-sandbox}
      PAYMENT_RETURN_BASE_URL: ${PAYMENT_RETURN_BASE_URL:-}
      ESEWA_MERCHANT_CODE: ${ESEWA_MERCHANT_CODE:-}
      ESEWA_SECRET_KEY: ${ESEWA_SECRET_KEY:-}
      KHALTI_SECRET_KEY: ${KHALTI_SECRET_KEY:-}
      # Phase 28 — Docker secrets. Point these at a mounted secret FILE instead
      # of passing the value inline; the app reads the file at startup (see
      # services/secrets.js). An env-var secret is printed in full by
      # `docker inspect` to anyone with socket access on the host, so a file is
      # strictly better in production. Left empty by default so a plain
      # `docker compose up` still works with .env.
      JWT_SECRET_FILE: ${JWT_SECRET_FILE:-}
      ESEWA_SECRET_KEY_FILE: ${ESEWA_SECRET_KEY_FILE:-}
      KHALTI_SECRET_KEY_FILE: ${KHALTI_SECRET_KEY_FILE:-}
    secrets:
      - mongodb_uri
    depends_on:
      mongo-init:
        condition: service_completed_successfully
    # The API bridges the two networks: it is the ONLY service that can reach
    # MongoDB, and the only backend `web` is allowed to proxy to.
    networks:
      - backend
      - frontend
    ports:
      # Loopback only: direct API access is for host-side diagnostics. All real
      # traffic arrives through nginx on :8080.
      - "127.0.0.1:4000:4000"
    stop_grace_period: 15s
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # Declared in compose as well as the Dockerfile. `web` depends on
    # `service_healthy`, and Compose can only honour that if the healthcheck is
    # visible HERE -- a Dockerfile HEALTHCHECK is inherited but is easy to lose
    # when an image is swapped for a prebuilt one.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/health').then(r=>r.json()).then(j=>process.exit(j.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 40s

  web:
    build:
      context: .
      dockerfile: client/Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    # FRONTEND ONLY. nginx can reach the API and nothing else; it has no route
    # to MongoDB even if the container is compromised.
    networks:
      - frontend
    ports:
      # Container listens on 8080 (non-root cannot bind :80).
      - "8080:8080"
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # Tests NGINX ITSELF by serving the SPA shell from local disk. The image's
    # own healthcheck proxies /health to the API, which cannot distinguish
    # "nginx is broken" from "the API is down" -- and would mark nginx
    # unhealthy during an API restart even though it is serving correctly.
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/index.html"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

# Two networks, so a compromise of the public-facing container does not put it
# on the same segment as the database. `backend` is marked internal: it has no
# route off the host at all.
networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
    internal: true

# P2H.4 — file-mounted credentials.
#
# Generated per deployment by `scripts/mongo-bootstrap-auth.sh` into a
# git-ignored `secrets/` directory, so no password is ever committed and no two
# deployments share one.
secrets:
  mongo_keyfile:
    file: ./secrets/mongo_keyfile
  mongo_root_password:
    file: ./secrets/mongo_root_password
  mongo_app_password:
    file: ./secrets/mongo_app_password
  mongodb_uri:
    file: ./secrets/mongodb_uri

volumes:
  mongo_data:
